```html
<!DOCTYPE html>
<html>
<head>
<title>MyTube RGB ULTRA 🔥</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:'Segoe UI';
color:white;
overflow-x:hidden;
background:#000;
}

/* RGB BACKGROUND */
.video-bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
background:linear-gradient(45deg, red, blue, purple, cyan);
background-size:400% 400%;
animation:rgbMove 12s infinite linear;
filter:blur(120px);
opacity:0.7;
}

@keyframes rgbMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
padding:15px 30px;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(10px);
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-size:24px;
font-weight:bold;
color:#ff4757;
text-shadow:0 0 15px #ff4757;
}

#search{
padding:10px;
border-radius:20px;
border:none;
width:40%;
}

/* LAYOUT */
.main{
display:flex;
}

.sidebar{
width:200px;
background:rgba(0,0,0,0.3);
padding:20px;
height:100vh;
}

.sidebar div{
margin:15px 0;
cursor:pointer;
transition:0.3s;
}

.sidebar div:hover{
color:#ff4757;
}

.content{
flex:1;
padding:20px;
}

/* PLAYER */
.player iframe{
width:100%;
height:420px;
border-radius:15px;
box-shadow:
0 0 20px red,
0 0 40px blue,
0 0 60px purple;
animation:glow 4s infinite alternate;
}

@keyframes glow{
from{filter:hue-rotate(0deg);}
to{filter:hue-rotate(360deg);}
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:20px;
margin-top:20px;
}

.card{
background:rgba(255,255,255,0.05);
border-radius:15px;
overflow:hidden;
cursor:pointer;
transition:0.4s;
position:relative;
backdrop-filter:blur(10px);
}

.card:hover{
transform:scale(1.08);
box-shadow:0 0 25px #ff4757;
}

.card img{
width:100%;
}

/* HOVER VIDEO */
.card video{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
opacity:0;
transition:0.3s;
}

.card:hover video{
opacity:1;
}

.card h3{
padding:10px;
font-size:14px;
}

/* STATS */
.stats{
display:flex;
justify-content:space-between;
padding:5px 10px;
font-size:13px;
}

.like{
cursor:pointer;
}

.like:hover{
color:#ff4757;
}
</style>
</head>

<body>

<div class="video-bg"></div>

<header>
<div class="logo">🔥 MyTube RGB</div>
<input id="search" placeholder="Search..." onkeyup="searchVideo()">
</header>

<div class="main">

<div class="sidebar">
<div onclick="loadVideos(videos)">🏠 Home</div>
<div onclick="filter('music')">🎵 Music</div>
<div onclick="filter('gaming')">🎮 Gaming</div>
<div onclick="filter('action')">🎬 Action</div>
<div onclick="filter('mix')">🔥 Mix</div>
</div>

<div class="content">

<div class="player">
<iframe id="player" src="https://www.youtube.com/embed/db-fpyGiZLA" allowfullscreen></iframe>
</div>

<div class="grid" id="videoGrid"></div>

</div>
</div>

<script>

let videos = [

{id:"db-fpyGiZLA", title:"Cool Video 1", category:"action", likes:0, views:0},
{id:"J-zn8PdvZOU", title:"Cool Video 2", category:"gaming", likes:0, views:0},
{id:"QdBZY2fkU-0", title:"Cool Video 3", category:"music", likes:0, views:0},
{id:"-D3gRhe8AhY", title:"Cool Video 4", category:"action", likes:0, views:0},

{id:"F5W1G5Qbti0", title:"New Video 1", category:"music", likes:0, views:0},
{id:"IR1n0hp4Prg", title:"New Video 2", category:"gaming", likes:0, views:0},
{id:"Ulm_Z646eBg", title:"New Video 3", category:"music", likes:0, views:0},
{id:"qPlLz6w_E7E", title:"New Video 4", category:"mix", likes:0, views:0},
{id:"6KzmSiLFBxk", title:"New Video 5", category:"action", likes:0, views:0},
{id:"3iV54pjmstA", title:"New Video 6", category:"gaming", likes:0, views:0}

];

function loadVideos(list){
let grid=document.getElementById("videoGrid");
grid.innerHTML="";

list.forEach((v,i)=>{
grid.innerHTML+=`
<div class="card" 
onmouseover="preview(this,'${v.id}')" 
onmouseout="stopPreview(this)"
onclick="play('${v.id}',${i})">

<img src="https://img.youtube.com/vi/${v.id}/0.jpg">

<video muted loop></video>

<h3>${v.title}</h3>

<div class="stats">
<span>${v.views} 👁️</span>
<span class="like" onclick="like(event,${i})">❤️ ${v.likes}</span>
</div>

</div>
`;
});
}

function play(id,i){
videos[i].views++;
document.getElementById("player").src="https://www.youtube.com/embed/"+id;
loadVideos(videos);
window.scrollTo({top:0,behavior:'smooth'});
}

function like(e,i){
e.stopPropagation();
videos[i].likes++;
loadVideos(videos);
}

function preview(card,id){
let vid=card.querySelector("video");
vid.src="https://www.youtube.com/embed/"+id;
vid.play();
}

function stopPreview(card){
let vid=card.querySelector("video");
vid.pause();
vid.src="";
}

function searchVideo(){
let val=document.getElementById("search").value.toLowerCase();
let filtered=videos.filter(v=>v.title.toLowerCase().includes(val));
loadVideos(filtered);
}

function filter(cat){
let filtered=videos.filter(v=>v.category===cat);
loadVideos(filtered);
}

loadVideos(videos);

</script>

</body>
</html>
