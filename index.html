```html
<!DOCTYPE html>
<html>
<head>
<title>MyTube 🔥</title>

<style>
body {
margin:0;
font-family:Arial;
background:#0f2027;
color:white;
}

header {
background:#111;
padding:15px;
text-align:center;
font-size:24px;
font-weight:bold;
}

#search {
width:80%;
padding:10px;
margin:15px;
border-radius:20px;
border:none;
}

.container {
display:flex;
flex-wrap:wrap;
justify-content:center;
}

.card {
width:300px;
margin:10px;
background:#1c1c1c;
border-radius:10px;
overflow:hidden;
cursor:pointer;
transition:0.3s;
}

.card:hover {
transform:scale(1.05);
}

.card img {
width:100%;
}

.card h3 {
padding:10px;
font-size:16px;
}

.player {
text-align:center;
margin:20px;
}

iframe {
width:80%;
height:400px;
border-radius:10px;
}
</style>
</head>

<body>

<header>🔥 MyTube</header>

<center>
<input id="search" placeholder="Search videos..." onkeyup="searchVideo()">
</center>

<div class="player">
<iframe id="videoPlayer" src="https://www.youtube.com/embed/db-fpyGiZLA" allowfullscreen></iframe>
</div>

<div class="container" id="videoList"></div>

<script>

let videos = [
{id:"db-fpyGiZLA", title:"Cool Video 1"},
{id:"J-zn8PdvZOU", title:"Cool Video 2"},
{id:"QdBZY2fkU-0", title:"Cool Video 3"},
{id:"-D3gRhe8AhY", title:"Cool Video 4"}
];

function loadVideos(list){
let box=document.getElementById("videoList");
box.innerHTML="";

list.forEach(v=>{
box.innerHTML+=`
<div class="card" onclick="playVideo('${v.id}')">
<img src="https://img.youtube.com/vi/${v.id}/0.jpg">
<h3>${v.title}</h3>
</div>
`;
});
}

function playVideo(id){
document.getElementById("videoPlayer").src =
"https://www.youtube.com/embed/"+id;
}

function searchVideo(){
let input=document.getElementById("search").value.toLowerCase();
let filtered = videos.filter(v=>v.title.toLowerCase().includes(input));
loadVideos(filtered);
}

loadVideos(videos);

</script>

</body>
</html>
